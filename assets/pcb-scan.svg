<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Animated technical scan of the Dead Drop PCB">
<defs>
  <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#123044"/><stop offset="1" stop-color="#0b202e"/>
  </linearGradient>
  <filter id="softGlow"><feGaussianBlur stdDeviation="5"/></filter>
  <style>
    .label{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px;fill:#dbe7ef}
    .sub{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#6e8392}
    .trace{stroke:#3c6b80;stroke-width:2;fill:none}
    .fine{stroke:#284b5d;stroke-width:1;fill:none}
    .chip{fill:#101a21;stroke:#5d7888;stroke-width:1.2}
    .bright{stroke:#8bd8f4;fill:none}
    .dot{fill:#8bd8f4}
    .scan{stroke:#8bd8f4;stroke-width:2;opacity:.85}
    @keyframes sweep{0%{transform:translateX(-700px)}100%{transform:translateX(700px)}}
    @keyframes glow{0%,100%{opacity:.2}50%{opacity:1}}
    .scanner{animation:sweep 4.2s cubic-bezier(.45,0,.55,1) infinite}
    .target{animation:glow 2.6s ease-in-out infinite}
  </style>
  <clipPath id="clip"><rect x="115" y="105" width="770" height="300" rx="22"/></clipPath>
</defs>

<rect width="1000" height="500" rx="18" fill="#070b10"/>
<text x="42" y="42" class="label">PCB / LIVE INSPECTION</text>
<text x="42" y="64" class="sub">LAYOUT OVERVIEW · COMPONENT LOCATIONS</text>

<rect x="115" y="105" width="770" height="300" rx="22" fill="url(#board)" stroke="#547181" stroke-width="2"/>

<g clip-path="url(#clip)">
  <!-- USB-A -->
  <rect x="70" y="205" width="120" height="95" rx="7" fill="#18232b" stroke="#738896"/>
  <rect x="88" y="224" width="16" height="10" fill="#a9c0cb"/>
  <rect x="88" y="266" width="16" height="10" fill="#a9c0cb"/>
  <text x="122" y="258" class="sub">USB-A</text>

  <!-- OLED -->
  <rect x="360" y="120" width="290" height="82" rx="8" fill="#17252e" stroke="#78909c"/>
  <rect x="400" y="139" width="205" height="42" fill="#0b1218" stroke="#314b59"/>
  <text x="468" y="164" class="sub">OLED</text>

  <!-- microSD -->
  <rect x="635" y="120" width="150" height="55" rx="7" class="chip"/>
  <text x="668" y="153" class="sub">microSD</text>

  <!-- ESP32 -->
  <rect x="390" y="250" width="235" height="112" rx="9" class="chip"/>
  <text x="470" y="294" class="label">ESP32-S3</text>
  <text x="450" y="318" class="sub">WROOM MODULE</text>
  <path d="M430 362V410M460 362V410M490 362V410M520 362V410M550 362V410M580 362V410" class="fine"/>

  <!-- USB-C -->
  <rect x="825" y="205" width="95" height="72" rx="8" fill="#18232b" stroke="#738896"/>
  <text x="845" y="248" class="sub">USB-C</text>

  <!-- power -->
  <rect x="215" y="130" width="105" height="60" rx="7" class="chip"/>
  <text x="240" y="165" class="sub">POWER</text>

  <!-- switch -->
  <rect x="235" y="285" width="48" height="48" rx="8" class="chip"/>
  <circle cx="259" cy="309" r="9" fill="#78909c"/>

  <!-- traces -->
  <path d="M190 250H350V290H390M320 160H360M650 160H825M625 290H825V240M320 315H390M650 330H800V260" class="trace"/>
  <path d="M260 190V245H350M650 202V235H710V120M715 277H785V350H625" class="fine"/>
  <path d="M195 225H300V135H360M650 345H735V390H825" class="fine"/>

  <!-- scan glow -->
  <rect x="250" y="90" width="18" height="330" class="scan scanner" filter="url(#softGlow)" opacity=".45"/>
  <rect x="250" y="90" width="2" height="330" class="scan scanner"/>

  <circle cx="507" cy="306" r="6" class="dot target"/>
  <circle cx="710" cy="148" r="5" class="dot target" style="animation-delay:.8s"/>
  <circle cx="260" cy="309" r="4" class="dot target" style="animation-delay:1.5s"/>
</g>

<!-- callouts -->
<path d="M392 250H290V235H235" class="bright"/>
<text x="150" y="230" class="label">POWER</text>

<path d="M625 305H745V325H830" class="bright"/>
<text x="755" y="345" class="label">ESP32-S3</text>

<path d="M785 147H850" class="bright"/>
<text x="850" y="137" class="label">STORAGE</text>

<text x="115" y="445" class="sub">SCAN / COMPONENTS VERIFIED / BOARD VIEW</text>
<text x="730" y="445" class="sub">STATUS: <tspan fill="#86efac">READY</tspan></text>
</svg>