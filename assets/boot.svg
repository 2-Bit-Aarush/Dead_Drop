<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Dead Drop animated terminal boot sequence">
<defs>
  <style>
    .bg{fill:#090d12}.panel{fill:none;stroke:#263442}.txt{font:16px monospace;fill:#cbd5e1}.muted{font:14px monospace;fill:#64748b}.accent{font:16px monospace;fill:#7dd3fc}.ok{font:16px monospace;fill:#86efac}
    .line{opacity:0;animation:show .5s forwards}.l1{animation-delay:.4s}.l2{animation-delay:.8s}.l3{animation-delay:1.2s}.l4{animation-delay:1.6s}.l5{animation-delay:2s}.l6{animation-delay:2.4s}.ready{opacity:0;animation:show .6s 3s forwards}
    .cursor{animation:blink 1s steps(2,end) infinite}
    @keyframes show{to{opacity:1}} @keyframes blink{50%{opacity:0}}
  </style>
</defs>
<rect width="900" height="360" rx="16" class="bg"/>
<rect x="1" y="1" width="898" height="358" rx="15" class="panel"/>
<circle cx="28" cy="28" r="6" fill="#7dd3fc"/><circle cx="49" cy="28" r="6" fill="#475569"/><circle cx="70" cy="28" r="6" fill="#334155"/>
<text x="95" y="34" class="muted">dead-drop // hardware console</text>
<text x="42" y="82" class="accent">$ ./dead-drop --boot</text>
<text x="42" y="125" class="txt line l1">ESP32-S3              <tspan class="ok">ONLINE</tspan></text>
<text x="42" y="158" class="txt line l2">microSD               <tspan class="ok">DETECTED</tspan></text>
<text x="42" y="191" class="txt line l3">128×32 OLED           <tspan class="ok">READY</tspan></text>
<text x="42" y="224" class="txt line l4">USB                   <tspan class="ok">READY</tspan></text>
<text x="42" y="257" class="txt line l5">POWER                 <tspan class="ok">OK</tspan></text>
<text x="42" y="290" class="txt line l6">PCB DRC               <tspan class="ok">0 ERRORS</tspan></text>
<text x="42" y="328" class="accent ready">SYSTEM READY<tspan class="cursor">_</tspan></text>
</svg>