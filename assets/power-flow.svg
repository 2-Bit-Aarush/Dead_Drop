<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Dead Drop power distribution">
<defs>
  <style>
    .title{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px;fill:#dce7ee}
    .sub{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#687c8a}
    .box{fill:#0d171f;stroke:#354b58;stroke-width:1.5}
    .rail{stroke:#3c5c6b;stroke-width:3;fill:none}
    .accent{stroke:#79c9e8;stroke-width:2;fill:none}
    .dot{fill:#8bd8f4}
    .out{fill:#0f2029;stroke:#527281}
    @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
    .blink{animation:blink 1.8s ease-in-out infinite}
  </style>
</defs>

<rect width="1000" height="420" rx="18" fill="#070b10"/>
<text x="40" y="42" class="title">POWER ARCHITECTURE</text>
<text x="40" y="64" class="sub">INPUT → PATH MANAGEMENT → REGULATION → SYSTEM RAIL</text>

<!-- input -->
<rect x="50" y="125" width="165" height="78" rx="10" class="box"/>
<text x="105" y="158" class="title">USB-C</text>
<text x="96" y="181" class="sub">POWER INPUT</text>

<!-- TPS -->
<rect x="285" y="110" width="190" height="108" rx="12" class="box"/>
<text x="337" y="153" class="title">TPS2116</text>
<text x="331" y="177" class="sub">POWER PATH</text>
<text x="329" y="196" class="sub">MANAGEMENT</text>

<!-- regulator -->
<rect x="545" y="110" width="190" height="108" rx="12" class="box"/>
<text x="587" y="153" class="title">AP63203</text>
<text x="590" y="177" class="sub">DC / DC</text>
<text x="578" y="196" class="sub">3.3V REGULATION</text>

<!-- main rail -->
<path d="M215 164H285M475 164H545M735 164V280" class="rail"/>
<path d="M215 164H285M475 164H545M735 164V280" class="accent"/>

<circle r="5" class="dot">
  <animateMotion dur="2s" repeatCount="indefinite" path="M215 164H285"/>
</circle>
<circle r="5" class="dot">
  <animateMotion dur="2s" begin=".65s" repeatCount="indefinite" path="M475 164H545"/>
</circle>
<circle r="5" class="dot">
  <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M735 164V280"/>
</circle>

<!-- rail label -->
<text x="755" y="225" class="sub">3V3 SYSTEM RAIL</text>

<!-- loads -->
<path d="M735 280H175M735 280H450M735 280H825" class="rail"/>
<path d="M175 280V305M450 280V305M825 280V305" class="accent"/>

<rect x="75" y="305" width="200" height="65" rx="9" class="out"/>
<text x="140" y="335" class="title">ESP32-S3</text>
<text x="143" y="356" class="sub">PROCESSING</text>

<rect x="350" y="305" width="200" height="65" rx="9" class="out"/>
<text x="420" y="335" class="title">microSD</text>
<text x="414" y="356" class="sub">STORAGE</text>

<rect x="725" y="305" width="200" height="65" rx="9" class="out"/>
<text x="795" y="335" class="title">OLED</text>
<text x="783" y="356" class="sub">INTERFACE</text>

<circle cx="735" cy="280" r="6" fill="#86efac" class="blink"/>
</svg>