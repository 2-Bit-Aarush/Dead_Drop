<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="Dead Drop PCB design layers being revealed">
<defs>
  <style>
    .bg{fill:#080c11}.label{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px;fill:#dbe7ef}.sub{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#687c8a}
    .panel{fill:#0e171f;stroke:#2d424f}.trace{stroke:#4b7488;stroke-width:2;fill:none}.silk{stroke:#c7d3db;stroke-width:1.4;fill:none}.pad{fill:#a6bac5}.mask{fill:#102a37;stroke:#4e7180}
    .phase{opacity:0}.p1{animation:appear 6s 0s infinite}.p2{animation:appear 6s .8s infinite}.p3{animation:appear 6s 1.6s infinite}.p4{animation:appear 6s 2.4s infinite}.p5{animation:appear 6s 3.2s infinite}.check{animation:blink 6s 4s infinite}
    @keyframes appear{0%,12%{opacity:0}18%,80%{opacity:1}90%,100%{opacity:0}}
    @keyframes blink{0%,60%{opacity:.25}68%,78%{opacity:1}90%,100%{opacity:.25}}
  </style>
</defs>
<rect width="1000" height="430" rx="18" class="bg"/>
<text x="42" y="42" class="label">PCB DESIGN / LAYER REVEAL</text>
<text x="42" y="64" class="sub">FROM PLACEMENT TO VERIFIED BOARD</text>

<!-- left timeline -->
<line x1="72" y1="110" x2="72" y2="350" stroke="#29404d"/>
<circle cx="72" cy="112" r="5" fill="#79c9e8"/><circle cx="72" cy="170" r="5" fill="#79c9e8"/><circle cx="72" cy="228" r="5" fill="#79c9e8"/><circle cx="72" cy="286" r="5" fill="#79c9e8"/><circle cx="72" cy="344" r="5" fill="#79c9e8"/>
<text x="92" y="116" class="sub">PLACEMENT</text>
<text x="92" y="174" class="sub">POWER</text>
<text x="92" y="232" class="sub">SIGNAL</text>
<text x="92" y="290" class="sub">SILKSCREEN</text>
<text x="92" y="348" class="sub">DRC</text>

<!-- board -->
<rect x="380" y="92" width="560" height="270" rx="20" class="panel"/>
<g class="p1">
  <rect x="415" y="125" width="150" height="65" rx="8" class="mask"/>
  <rect x="620" y="125" width="220" height="72" rx="8" class="mask"/>
  <rect x="540" y="250" width="210" height="85" rx="8" class="mask"/>
  <text x="448" y="161" class="sub">POWER</text>
  <text x="690" y="165" class="sub">OLED / STORAGE</text>
  <text x="610" y="298" class="sub">ESP32-S3</text>
</g>
<g class="p2">
  <path d="M415 210H540V250M565 155H620M750 197V250H750M565 285H540V335M750 290H860V210" class="trace"/>
  <path d="M455 190V235H500M840 197V120H900" class="trace"/>
</g>
<g class="p3">
  <circle cx="430" cy="215" r="5" class="pad"/><circle cx="520" cy="235" r="5" class="pad"/><circle cx="590" cy="220" r="5" class="pad"/><circle cx="805" cy="230" r="5" class="pad"/>
  <circle cx="580" cy="330" r="5" class="pad"/><circle cx="800" cy="330" r="5" class="pad"/>
</g>
<g class="p4">
  <path d="M410 105H905V350H410Z" class="silk"/>
  <text x="430" y="118" class="sub">DEAD DROP</text>
  <text x="815" y="345" class="sub">2L</text>
</g>
<g class="p5">
  <circle cx="865" cy="115" r="15" fill="none" stroke="#86efac" stroke-width="2"/>
  <path d="M857 115L863 121L874 108" fill="none" stroke="#86efac" stroke-width="2"/>
  <text x="785" y="385" class="label">DRC: 0 ERRORS</text>
</g>

<text x="380" y="402" class="sub">SCHEMATIC → PLACEMENT → ROUTING → SILKSCREEN → VERIFIED</text>
</svg>