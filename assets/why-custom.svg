<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Dead Drop replaces separate development modules with one integrated custom PCB">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b10"/><stop offset="1" stop-color="#0d151c"/>
  </linearGradient>
  <style>
    .title{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px;fill:#dce7ee}
    .sub{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#667b89}
    .mod{fill:#101920;stroke:#344b59;stroke-width:1.5}
    .modtxt{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cbd7df}
    .wire{stroke:#456779;stroke-width:2;fill:none}
    .accent{stroke:#79c9e8;fill:none}
    .board{fill:#0d202b;stroke:#62808f;stroke-width:1.5}
    @keyframes pull{0%,12%{transform:translate(0,0);opacity:1}42%,75%{transform:translate(190px,0);opacity:1}88%,100%{transform:translate(190px,0);opacity:0}}
    @keyframes reveal{0%,42%{opacity:0}58%,88%{opacity:1}100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
    .p1{animation:pull 5s ease-in-out infinite}
    .p2{animation:pull 5s .15s ease-in-out infinite}
    .p3{animation:pull 5s .3s ease-in-out infinite}
    .p4{animation:pull 5s .45s ease-in-out infinite}
    .p5{animation:pull 5s .6s ease-in-out infinite}
    .p6{animation:pull 5s .75s ease-in-out infinite}
    .reveal{animation:reveal 5s ease-in-out infinite}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
  </style>
</defs>

<rect width="1000" height="470" rx="18" fill="url(#bg)"/>
<text x="40" y="42" class="title">WHY CUSTOM</text>
<text x="40" y="64" class="sub">THE PROTOTYPE STACK → ONE PURPOSE-BUILT BOARD</text>

<!-- left stack -->
<g>
  <rect x="55" y="92" width="190" height="46" rx="8" class="mod"/>
  <text x="88" y="121" class="modtxt">ESP32</text>
  <rect x="55" y="150" width="190" height="46" rx="8" class="mod"/>
  <text x="92" y="179" class="modtxt">SD MODULE</text>
  <rect x="55" y="208" width="190" height="46" rx="8" class="mod"/>
  <text x="103" y="237" class="modtxt">OLED</text>
  <rect x="55" y="266" width="190" height="46" rx="8" class="mod"/>
  <text x="101" y="295" class="modtxt">USB</text>
  <rect x="55" y="324" width="190" height="46" rx="8" class="mod"/>
  <text x="102" y="353" class="modtxt">POWER</text>
  <rect x="55" y="382" width="190" height="46" rx="8" class="mod"/>
  <text x="103" y="411" class="modtxt">WIRES</text>
</g>

<!-- moving copies -->
<g class="p1"><rect x="55" y="92" width="190" height="46" rx="8" class="mod"/><text x="88" y="121" class="modtxt">ESP32</text></g>
<g class="p2"><rect x="55" y="150" width="190" height="46" rx="8" class="mod"/><text x="92" y="179" class="modtxt">SD MODULE</text></g>
<g class="p3"><rect x="55" y="208" width="190" height="46" rx="8" class="mod"/><text x="103" y="237" class="modtxt">OLED</text></g>
<g class="p4"><rect x="55" y="266" width="190" height="46" rx="8" class="mod"/><text x="101" y="295" class="modtxt">USB</text></g>
<g class="p5"><rect x="55" y="324" width="190" height="46" rx="8" class="mod"/><text x="102" y="353" class="modtxt">POWER</text></g>
<g class="p6"><rect x="55" y="382" width="190" height="46" rx="8" class="mod"/><text x="103" y="411" class="modtxt">WIRES</text></g>

<!-- convergence -->
<path d="M245 115H300M245 173H300M245 231H300M245 289H300M245 347H300M245 405H300" class="wire"/>
<path d="M300 115C345 115 345 235 390 235M300 173C350 173 350 235 390 235M300 231H390M300 289C350 289 350 235 390 235M300 347C345 347 345 235 390 235M300 405C345 405 345 235 390 235" class="accent" opacity=".7"/>
<circle cx="390" cy="235" r="5" fill="#79c9e8" class="pulse"/>

<!-- integrated board -->
<g class="reveal">
  <rect x="455" y="88" width="480" height="294" rx="24" class="board"/>
  <text x="492" y="130" class="title">DEAD DROP</text>
  <text x="492" y="151" class="sub">ONE CUSTOM PCB</text>

  <rect x="500" y="188" width="125" height="55" rx="8" class="mod"/>
  <text x="533" y="221" class="sub">STORAGE</text>

  <rect x="655" y="170" width="180" height="92" rx="10" fill="#0a141b" stroke="#79c9e8"/>
  <text x="701" y="213" class="title">PROCESSING</text>
  <text x="718" y="236" class="sub">ESP32-S3</text>

  <rect x="500" y="285" width="125" height="48" rx="8" class="mod"/>
  <text x="532" y="315" class="sub">POWER</text>

  <rect x="655" y="285" width="180" height="48" rx="8" class="mod"/>
  <text x="704" y="315" class="sub">CONNECTIVITY</text>

  <path d="M625 216H655M745 262V285M625 309H655" class="accent"/>
  <circle cx="655" cy="216" r="3" fill="#79c9e8" class="pulse"/>
</g>

<text x="455" y="410" class="sub">LESS WIRING · LESS VOLUME · MORE CONTROL</text>
</svg>