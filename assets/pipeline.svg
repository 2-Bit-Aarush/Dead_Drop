<circle cx="95" cy="125" r="14" class="node"/><circle cx="258" cy="125" r="14" class="node"/><circle cx="421" cy="125" r="14" class="node"/><circle cx="584" cy="125" r="14" class="node"/><circle cx="747" cy="125" r="14" class="node"/><circle cx="905" cy="125" r="14" class="node"/>
