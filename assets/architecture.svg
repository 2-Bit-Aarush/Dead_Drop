<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="Dead Drop system architecture with animated data flow">
<defs>
<style>
.bg{fill:#090d12}.box{fill:#0d141c;stroke:#334454;stroke-width:1.5}.t{font:16px monospace;fill:#dbe4ee}.s{font:12px monospace;fill:#64748b}.a{stroke:#7dd3fc;stroke-width:2;fill:none;stroke-dasharray:7 10;animation:flow 1.4s linear infinite}.dot{fill:#7dd3fc}.title{font:14px monospace;fill:#7dd3fc}
@keyframes flow{to{stroke-dashoffset:-34}}
</style>
<filter id="g"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1000" height="430" rx="16" class="bg"/>
<text x="40" y="45" class="title">DEAD DROP // SYSTEM ARCHITECTURE</text>

<rect x="55" y="155" width="180" height="100" rx="10" class="box"/>
<text x="90" y="198" class="t">microSD</text><text x="90" y="223" class="s">REMOVABLE STORAGE</text>

<rect x="390" y="130" width="220" height="150" rx="12" class="box"/>
<text x="455" y="190" class="t">ESP32-S3</text><text x="438" y="218" class="s">PROCESSING / CONTROL</text><text x="465" y="244" class="s">Wi-Fi · USB · BT</text>

<rect x="765" y="70" width="170" height="85" rx="10" class="box"/>
<text x="830" y="108" class="t">Wi-Fi</text><text x="797" y="133" class="s">ONLINE ACCESS</text>

<rect x="765" y="190" width="170" height="85" rx="10" class="box"/>
<text x="825" y="228" class="t">USB</text><text x="800" y="253" class="s">USB-A / USB-C</text>

<rect x="765" y="310" width="170" height="65" rx="10" class="box"/>
<text x="815" y="349" class="t">OLED</text>

<path d="M235 205H390" class="a"/><path d="M610 175H765" class="a"/><path d="M610 230H765" class="a"/><path d="M610 255C690 280 700 340 765 340" class="a"/>
<circle cx="0" cy="0" r="5" class="dot"><animateMotion dur="1.8s" repeatCount="indefinite" path="M235 205H390"/></circle>
<circle cx="0" cy="0" r="5" class="dot"><animateMotion dur="2s" repeatCount="indefinite" path="M610 175H765"/></circle>
</svg>